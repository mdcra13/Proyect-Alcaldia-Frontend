sonar.organization=mdcra13
sonar.projectKey=mdcra13_Proyect-Alcaldia-Frontend
sonar.projectName=Proyect-Alcaldia-Frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.sourceEncoding=UTF-8

sonar.exclusions=src/components/ui/**,node_modules/**,dist/**,coverage/**

sonar.tests=src/test
sonar.test.inclusions=src/**/*.test.tsx,src/**/*.test.ts

